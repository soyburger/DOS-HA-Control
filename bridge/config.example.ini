[home_assistant]
# Base URL of your Home Assistant instance, no trailing slash.
base_url = http://homeassistant.local:8123
# Long-lived access token: HA profile page -> Security -> Long-Lived Access Tokens.
token = REPLACE_ME

[tcp]
enabled = true
host = 0.0.0.0
port = 6321

[serial]
enabled = false
port = /dev/ttyUSB0
baud = 9600

# One entry per entity you want visible on the DOS client.
# key = entity_id, value = friendly name shown in the TUI.
[entities]
light.kitchen = Kitchen Light
light.hallway = Hallway Light
switch.office_fan = Office Fan
