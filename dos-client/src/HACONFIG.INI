; HACONFIG.INI -- copy next to HACLIENT.EXE
; DOS 8.3 filenames only.

; COM and BAUD below are just the starting selection shown on the
; "Port Settings" screen at launch -- change them there with the
; keyboard (Left/Right for COM port, Up/Down for baud) instead of
; editing this file. Handy to set here anyway so you don't have to
; re-pick every time if you always use the same port.
COM=1
BAUD=9600

; Seconds to wait for a reply before giving up.
TIMEOUT=5
