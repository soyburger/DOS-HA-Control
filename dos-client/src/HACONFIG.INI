; HACONFIG.INI -- copy next to HACLIENT.EXE
; DOS 8.3 filenames only.

; TCP or SERIAL
TRANSPORT=TCP

; --- TCP settings (used when TRANSPORT=TCP) ---
; IP of the machine running bridge/ha_bridge.py. Requires mTCP set up with
; a working packet driver for the 3Com EtherLink III (3C5X9PD.COM) and an
; MTCPCFG.CFG the way mTCP's own docs describe.
HOST=192.168.1.50
PORT=6321

; --- Serial settings (used when TRANSPORT=SERIAL) ---
; COM=1 means COM1, COM=2 means COM2, etc.
COM=1
BAUD=9600

; Seconds to wait for a reply before giving up.
TIMEOUT=5
